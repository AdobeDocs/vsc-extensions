name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test (Linux — needs virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: npm test
